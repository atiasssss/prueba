```html
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mi Programa TV</title>

<style>
body {
    background-color: #101820;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    margin: 0;
    padding-top: 80px;
}

h1 {
    font-size: 45px;
    color: #00d4ff;
}

p {
    font-size: 24px;
}

button {
    background-color: #007bff;
    color: white;
    border: none;
    padding: 20px 40px;
    margin: 15px;
    font-size: 25px;
    border-radius: 10px;
    cursor: pointer;
}

button:focus {
    background-color: orange;
    outline: 4px solid white;
}

#resultado {
    margin-top: 40px;
    font-size: 30px;
    color: #00ff88;
}
</style>
</head>

<body>

<h1>MI PROGRAMA TV</h1>

<p>Bienvenido a mi aplicación</p>

<button onclick="mostrarMensaje()">
Iniciar programa
</button>

<button onclick="mostrarHora()">
Mostrar hora
</button>

<div id="resultado"></div>

<script>
function mostrarMensaje() {
    document.getElementById("resultado").innerHTML =
    "¡El programa funciona correctamente!";
}

function mostrarHora() {
    var fecha = new Date();

    document.getElementById("resultado").innerHTML =
    "Hora actual: " + fecha.toLocaleTimeString();
}
</script>

</body>
</html>
